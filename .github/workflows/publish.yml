name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist/

      - name: Smoke test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/wog-dump --help > /dev/null
          /tmp/smoke/bin/wog-dump info --help > /dev/null
          /tmp/smoke/bin/python -c "
          import wog_dump
          print('wog-dump', wog_dump.__version__)
          from wog_dump.core.viewer import render_viewer_html
          from wog_dump.core.export import convert_format
          print('resources import OK')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build addon zip
        run: python scripts/build_addon.py --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wog_dump_addon
          path: dist/wog_dump_addon.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: no API token involved
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
