[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wog-plugin-report"
version = "0.1.0"
description = "WOG Dump CLI plugin: readable Markdown/JSON reports for built scenes"
requires-python = ">=3.12"
dependencies = ["rewog>=3.3", "click>=8.1"]

[project.entry-points."wog_dump.commands"]
scene-report = "wog_plugin_report:scene_report"

[tool.hatch.build.targets.wheel]
packages = ["src/wog_plugin_report"]