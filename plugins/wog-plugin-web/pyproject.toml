[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wog-plugin-web"
version = "0.1.0"
description = "WOG Dump web UI plugin: local browser console over the pipeline"
requires-python = ">=3.12"
dependencies = ["rewog>=3.3", "fastapi>=0.110", "uvicorn>=0.29"]

[project.entry-points."wog_dump.commands"]
serve = "wog_plugin_web.cli:serve"

[tool.hatch.build.targets.wheel]
packages = ["src/wog_plugin_web"]