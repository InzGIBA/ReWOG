<!DOCTYPE html>
<html lang="en" data-token="__TOKEN__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>WOG Dump</title>
<link rel="stylesheet" href="/t/__TOKEN__/static/smui.css">
<style>
/* One shell, three views. The sidebar is fixed; the content area
   swaps between the catalog grid, the weapon detail and the 3D
   viewer without reloading the page. */
[x-cloak] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  background: var(--background);
  color: var(--foreground);
}
a { text-decoration: none; color: inherit; }

/* -- sidebar --------------------------------------------------------- */
.side {
  width: 236px; flex: none;
  display: flex; flex-direction: column;
  background: var(--card);
  border-right: 1px solid var(--border);
  min-height: 0;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.brand .name { font-size: var(--text-ui); letter-spacing: 0.08em; text-transform: uppercase; }
.brand .dot { flex: none; }
.side-search { padding: 10px 12px; }
.side-search .input { width: 100%; }
.nav { flex: 1; overflow-y: auto; padding: 6px 0; min-height: 0; }
.nav .label {
  display: block; padding: 12px 16px 4px;
  font-size: var(--text-label); letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted-foreground);
}
.nav a.item {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 16px;
  font-size: var(--text-ui); color: var(--muted-foreground);
  border-left: 2px solid transparent;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nav a.item:hover { color: var(--foreground); background: var(--surface-2); }
.nav a.item.active { color: var(--primary); border-left-color: var(--primary); background: var(--surface-2); }
.nav a.item.muted { opacity: 0.5; }
.nav a.item .count { margin-left: auto; font-size: var(--text-label); color: var(--muted-foreground); }
.nav .sep { height: 1px; margin: 10px 16px; background: var(--border); }
.side-foot { border-top: 1px solid var(--border); padding: 10px 12px 12px; }
.log-toggle {
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; user-select: none;
  font-size: var(--text-label); letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted-foreground);
}
.log-toggle:hover { color: var(--foreground); }
.log-toggle .caret { display: inline-block; transition: transform 0.15s ease; }
.log-toggle .caret.open { transform: rotate(90deg); }
.log-toggle .live { margin-left: auto; }
.log {
  height: 160px; overflow: auto; margin: 8px 0 0;
  padding: 8px;
  background: var(--background);
  border: 1px solid var(--border);
  font-size: var(--text-label); color: var(--muted-foreground);
  white-space: pre-wrap; word-break: break-all;
}
.side-stats {
  margin-top: 10px;
  font-size: var(--text-label); color: var(--muted-foreground);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* -- content --------------------------------------------------------- */
.content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.view { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px; }
.view-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
.view-head h2 {
  margin: 0; font-size: var(--text-heading); font-weight: 400;
  letter-spacing: 0.02em;
}
.view-head .count { color: var(--muted-foreground); font-size: var(--text-ui); }
.empty { color: var(--muted-foreground); text-align: center; padding: 48px; }

/* catalog grid */
.grid {
  display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
}
.weapon-card {
  display: flex; flex-direction: column;
  background: var(--card);
  border: 1px solid var(--border);
  transition: border-color 0.15s ease;
  cursor: pointer;
}
.weapon-card:hover { border-color: var(--primary); }
.weapon-card .pic {
  position: relative;
  aspect-ratio: 1 / 1; width: 100%;
  background: #000;
  display: flex; align-items: center; justify-content: center;
}
.weapon-card img { width: 100%; height: 100%; object-fit: contain; display: block; }
.weapon-card .placeholder { color: var(--border); font-size: 30px; }
/* Pipeline dots overlay the render corner: they never compete with
   the text rows for card width */
.weapon-card .dots {
  position: absolute; top: 6px; right: 6px;
  display: flex; gap: 4px;
  padding: 4px 6px;
  background: rgba(10, 12, 16, 0.72);
}
.weapon-card .dot { width: 5px; height: 5px; }
.weapon-card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
.weapon-card .title {
  font-size: var(--text-ui);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.weapon-card:hover .title { color: var(--primary); }
.weapon-card .sub {
  color: var(--muted-foreground); font-size: var(--text-label); letter-spacing: 0.04em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.weapon-card .meta {
  color: var(--muted-foreground); font-size: var(--text-label);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* weapon detail */
.detail { max-width: 1100px; }
.detail-head { margin-bottom: 20px; }
.detail-head h2 { margin: 0 0 4px; font-size: 28px; font-weight: 400; letter-spacing: 0.02em; }
.detail-head .id { color: var(--muted-foreground); font-size: var(--text-ui); margin-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: var(--text-label); letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted-foreground); background: var(--surface-2);
  border: 1px solid var(--border); padding: 3px 8px;
}
.chip:hover { color: var(--primary); border-color: var(--primary); }

/* pipeline stepper: one grid column per stage — bulb and its label
   share the cell, so centers always line up; the wire is drawn from
   the previous bulb's center to this one via ::before */
.pipeline {
  margin: 20px 0 24px; padding: 16px 18px 14px;
  background: var(--card); border: 1px solid var(--border);
  max-width: 720px;
}
.pipeline .steps { display: grid; grid-template-columns: repeat(6, 1fr); }
.pipeline .step { position: relative; text-align: center; }
.pipeline .step::before {
  content: ""; position: absolute; top: 8px; left: -50%;
  width: 100%; height: 2px; background: var(--border);
}
.pipeline .step.no-wire::before { content: none; }
.pipeline .step.wire-done::before { background: var(--primary); }
.pipeline .step .bulb {
  position: relative; z-index: 1;
  display: block; margin: 0 auto;
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--border); background: var(--card);
  box-sizing: border-box;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.pipeline .step .bulb.done { background: var(--primary); border-color: var(--primary); }
.pipeline .step .label {
  margin-top: 8px;
  font-size: var(--text-label); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted-foreground);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.detail-body { display: flex; gap: 24px; align-items: stretch; }
.detail-media {
  width: 400px; flex: none;
  display: flex; flex-direction: column; gap: 14px;
}
.detail-media .frame {
  background: var(--card); border: 1px solid var(--border);
}
.detail-media .pic { aspect-ratio: 1 / 1; background: #000; display: flex; align-items: center; justify-content: center; }
.detail-media img { width: 100%; height: 100%; object-fit: contain; display: block; }
.detail-media .placeholder { color: var(--border); font-size: 48px; }
.detail-media .actions { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.detail-media .staterow { display: flex; gap: 6px; }
.detail-media .staterow .select { flex: 1; min-width: 0; }
.detail-info {
  flex: 1; min-width: 0;
  background: var(--card); border: 1px solid var(--border);
  padding: 20px 22px;
}
.props { display: grid; grid-template-columns: max-content 1fr; gap: 10px 26px; margin: 0 0 18px; }
.props dt {
  color: var(--muted-foreground); font-size: var(--text-label);
  letter-spacing: 0.06em; text-transform: uppercase; padding-top: 3px;
}
.props dd { margin: 0; font-size: 15px; }
.brief { margin: 0; color: var(--muted-foreground); font-size: var(--text-ui); line-height: 1.6; max-width: 560px; }

/* 3D viewer */
.viewer-view { padding: 0; display: flex; }
.viewer-view iframe { flex: 1; border: none; }
.viewer-placeholder {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
  color: var(--muted-foreground);
}
</style>
<script src="/t/__TOKEN__/static/app.js" defer></script>
<script src="/t/__TOKEN__/static/vendor/alpine.min.js" defer></script><!-- Alpine 3.14.9, vendored -->
</head>
<body x-data="shell" x-cloak>

<aside class="side">
  <div class="brand">
    <span class="dot dot-ok" title="serve online"></span>
    <span class="name">wog dump</span>
  </div>
  <div class="side-search">
    <input id="filter" class="input" placeholder="search" autocomplete="off"
           spellcheck="false" x-model="filter">
  </div>
  <nav class="nav">
    <a class="item" :class="route.view === 'catalog' && !category ? 'active' : ''"
       href="#/" @click="category = ''">catalog</a>

    <template x-if="categories.length">
      <div>
        <span class="label">categories</span>
        <template x-for="c in categories" :key="c.name">
          <a class="item" href="#/"
             :class="route.view === 'catalog' && category === c.name ? 'active' : ''"
             @click="category = (category === c.name ? '' : c.name)">
            <span x-text="c.name.toLowerCase()"></span>
            <span class="count" x-text="c.count"></span>
          </a>
        </template>
        <div class="sep"></div>
      </div>
    </template>

    <template x-if="route.weapon">
      <div>
        <span class="label" x-text="route.weapon"></span>
        <a class="item" :class="route.view === 'weapon' ? 'active' : ''"
           :href="`#/weapon/${route.weapon}`">info</a>
        <a class="item"
           :class="[route.view === 'viewer' ? 'active' : '', weapon && !weapon.scene ? 'muted' : '']"
           :href="`#/weapon/${route.weapon}/view`"
           :title="weapon && !weapon.scene ? 'no scene yet' : 'open the 3d viewer'">3d view</a>
      </div>
    </template>
  </nav>
  <div class="side-foot">
    <div class="log-toggle" @click="logOpen = !logOpen">
      <span class="caret" :class="logOpen ? 'open' : ''">&#9656;</span>
      <span>stage log</span>
      <span class="dot live" :class="logLive ? 'dot-ok' : 'dot-off'"
            :title="logLive ? 'stage running' : 'idle'"></span>
    </div>
    <pre class="log" x-show="logOpen" x-ref="log" x-text="logLines"></pre>
    <div class="side-stats" x-text="stats"></div>
  </div>
</aside>

<main class="content">

  <!-- catalog -->
  <section class="view" x-show="route.view === 'catalog'">
    <div class="view-head">
      <h2>catalog</h2>
      <span class="count" x-text="`${visible.length}/${weapons.length}`"></span>
    </div>
    <div class="grid">
      <template x-for="w in visible" :key="w.name">
        <a class="weapon-card" :href="`#/weapon/${w.name}`">
          <div class="pic">
            <img x-show="w.icon" loading="lazy" :src="`${base}/previews/${w.name}.png`" alt="">
            <span class="placeholder" x-show="!w.icon">?</span>
            <span class="dots">
              <template x-for="f in FLAGS" :key="f[0]">
                <span class="dot" :class="w[f[0]] ? 'dot-ok' : 'dot-off'"
                      :title="`${f[1]}: ${w[f[0]] ? 'done' : 'pending'}`"></span>
              </template>
            </span>
          </div>
          <div class="body">
            <span class="title" x-text="w.display_name || w.name"></span>
            <span class="sub" x-text="w.categories.join(', ') || w.name"></span>
            <span class="meta" x-text="cardMeta(w)"></span>
          </div>
        </a>
      </template>
    </div>
    <div class="empty" x-show="loaded && !visible.length">no weapons match</div>
  </section>

  <!-- weapon detail -->
  <section class="view" x-show="route.view === 'weapon'">
    <template x-if="weapon">
      <div class="detail">
        <div class="detail-head">
          <h2 x-text="weapon.display_name || weapon.name"></h2>
          <div class="id" x-text="weapon.name"></div>
          <div class="chips">
            <template x-for="c in weapon.categories" :key="c">
              <a class="chip" href="#/" @click="category = c" x-text="c"></a>
            </template>
          </div>
        </div>

        <!-- pipeline stepper: one circle per stage -->
        <div class="pipeline">
          <div class="steps" :style="`grid-template-columns: repeat(${pipeline.length}, 1fr)`">
            <template x-for="(s, i) in pipeline" :key="s.key">
              <div class="step"
                   :class="[s.done ? 'done' : '', i === 0 ? 'no-wire' : '', s.wire ? 'wire-done' : '']">
                <span class="bulb" :class="s.done ? 'done' : ''"
                      :title="`${s.title}: ${s.done ? 'done' : 'pending'}`"></span>
                <div class="label" x-text="s.title"></div>
              </div>
            </template>
          </div>
        </div>

        <div class="detail-body">
          <div class="detail-media">
            <div class="frame">
              <div class="pic">
                <img x-show="weapon.icon" :src="`${base}/previews/${weapon.name}_card.png`" alt="">
                <span class="placeholder" x-show="!weapon.icon">?</span>
              </div>
            </div>
            <div class="frame actions">
              <div class="staterow">
                <button class="btn btn-primary" @click="run('build-scene')">build scene</button>
                <select class="select" x-model="state">
                  <option value="">assembled</option>
                  <option value="field-strip">field-strip</option>
                  <option value="exploded">exploded</option>
                  <option value="parts">parts</option>
                </select>
              </div>
              <div class="staterow">
                <button class="btn btn-outline" @click="run('download-assets')">download</button>
                <button class="btn btn-outline" @click="run('decrypt-assets')">decrypt</button>
                <button class="btn btn-outline" @click="run('unpack-assets')">unpack</button>
              </div>
              <a class="btn btn-outline" x-show="weapon.scene"
                 :href="`#/weapon/${weapon.name}/view`">open 3d view</a>
            </div>
          </div>
          <div class="detail-info">
            <dl class="props">
              <template x-if="weapon.num_parts">
                <div style="display: contents">
                  <dt>parts</dt><dd x-text="weapon.num_parts"></dd>
                </div>
              </template>
              <template x-if="weapon.since">
                <div style="display: contents">
                  <dt>since</dt><dd x-text="weapon.since"></dd>
                </div>
              </template>
              <div style="display: contents">
                <dt>size</dt><dd x-text="`${(weapon.size_bytes / 1e6).toFixed(1)} MB`"></dd>
              </div>
              <template x-if="weapon.features">
                <div style="display: contents">
                  <dt>features</dt><dd x-text="weapon.features"></dd>
                </div>
              </template>
            </dl>
            <p class="brief" x-show="weapon.brief_info" x-text="weapon.brief_info"></p>
          </div>
        </div>
      </div>
    </template>
    <div class="empty" x-show="!weapon">loading&hellip;</div>
  </section>

  <!-- 3d viewer -->
  <section class="view viewer-view" x-show="route.view === 'viewer'">
    <template x-if="weapon && weapon.scene">
      <iframe :src="`${base}/view/${weapon.name}`" title="3d viewer"></iframe>
    </template>
    <div class="viewer-placeholder" x-show="weapon && !weapon.scene">
      <span>no scene yet — build one first</span>
      <button class="btn btn-primary" @click="run('build-scene')">build scene</button>
    </div>
  </section>

</main>

</body>
</html>
