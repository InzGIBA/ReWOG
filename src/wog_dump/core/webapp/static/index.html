<!DOCTYPE html>
<html lang="en">
<head>

<title>WOG Dump</title>
<style>
body { font-family: system-ui, sans-serif; margin: 20px; color-scheme: light dark; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid rgba(128,128,128,.25); }
th { cursor: pointer; }
input { padding: 6px 10px; margin-bottom: 12px; width: 240px; }
a { color: inherit; }
</style>

<body>

<tbody></tbody>
</table>

</html>
