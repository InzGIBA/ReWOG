<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WOG Dump weapon</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../static/smui.css">
<style>
body { margin: 0; overflow: hidden; }
#viewport { position: fixed; inset: 0; }
#panel {
  position: fixed; top: 16px; left: 16px; z-index: 2;
  width: 340px;
  background: var(--card);
  border: 1px solid var(--border);
}
#panel .head {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
#meta { color: var(--muted-foreground); }
#panel .body { padding: 12px 14px; }
.stage-row { display: flex; gap: 6px; margin-bottom: 8px; }
#state { flex: 1; min-width: 0; }
#viewerlink { margin-top: 2px; }
#viewerlink a { color: var(--primary); text-decoration: none; font-size: var(--text-label); letter-spacing: 0.08em; text-transform: uppercase; }
#viewerlink a:hover { text-decoration: underline; }
#panel .log { border-top: 1px solid var(--border); max-height: 220px; }
button { margin: 0; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three.module.min.js",
    "three/addons/": "../vendor/addons/"
  }
}
</script>
</head>
<body>
<canvas id="viewport"></canvas>
<div id="panel">
  <div class="head">
    <span class="label">weapon</span>
    <div id="meta">loading&hellip;</div>
  </div>
  <div class="body">
    <div class="stage-row">
      <button class="btn btn-primary" onclick="runStage('build-scene', WEAPON)">build scene</button>
      <select id="state" class="select">
        <option value="">assembled</option>
        <option value="field-strip">field-strip</option>
        <option value="exploded">exploded</option>
        <option value="parts">parts</option>
      </select>
    </div>
    <div class="stage-row">
      <button class="btn btn-outline" onclick="runStage('download-assets', WEAPON)">download</button>
      <button class="btn btn-outline" onclick="runStage('decrypt-assets', WEAPON)">decrypt</button>
      <button class="btn btn-outline" onclick="runStage('unpack-assets', WEAPON)">unpack</button>
    </div>
    <div id="viewerlink"></div>
  </div>
  <div class="log-head"><span class="label">stage log</span></div>
  <pre id="log" class="log"></pre>
</div>
<script type="module" src="../static/weapon-view.js"></script>
</body>
</html>
