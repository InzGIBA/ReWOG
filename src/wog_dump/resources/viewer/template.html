<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$TITLE - WOG Dump viewer</title>
<style>
:root {
  color-scheme: light dark;
  --font-mono: "Source Code Pro", ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --background: #1a1e24;
  --foreground: #d8dee9;
  --card: #21262e;
  --surface-2: #282e37;
  --muted-foreground: #8e99a8;
  --primary: #88c0d0;
  --primary-foreground: #1a1e24;
  --border: #3b4252;
  --border-hover: #4c566a;
}
@media (prefers-color-scheme: light) {
  :root {
    --background: #eceff4;
    --foreground: #2e3440;
    --card: #e5e9f0;
    --surface-2: #d8dee9;
    --muted-foreground: #4c566a;
    --primary: #4c6d94;
    --primary-foreground: #eceff4;
    --border: #c9cfda;
    --border-hover: #aeb6c5;
  }
}
$FONT_FACE
* { margin: 0; box-sizing: border-box; }
body {
  font-family: var(--font-mono);
  background: var(--background);
  color: var(--foreground);
  overflow: hidden;
}
#viewport { position: fixed; inset: 0; }
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 2;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
}
header h1 { font-size: 15px; font-weight: 600; }
header #stats { font-size: 12px; color: var(--muted-foreground); }
header button {
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 5px 10px; cursor: pointer;
  border: 1px solid var(--border);
  border-radius: 0; background: transparent; color: var(--foreground);
  transition: border-color 0.15s ease;
}
header button:hover { border-color: var(--border-hover); }
#panel {
  position: fixed; top: 53px; right: 0; bottom: 0; width: 230px; z-index: 2;
  overflow-y: auto; padding: 8px;
  background: var(--card);
  border-left: 1px solid var(--border);
}
#card {
  position: fixed; left: 12px; bottom: 12px; z-index: 2; display: none;
  padding: 10px 14px; font-size: 13px;
  background: var(--card);
  border: 1px solid var(--border);
}
#panel h2 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted-foreground); padding: 6px 8px; font-weight: 400;
}
#parts { list-style: none; padding: 0; }
#parts li {
  font-size: 13px; padding: 5px 10px; cursor: pointer;
  white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
#parts li:hover { background: var(--surface-2); }
#parts li.selected { background: var(--primary); color: var(--primary-foreground); }
</style>
<script type="importmap">
$IMPORT_MAP
</script>
</head>
<body>
<canvas id="viewport"></canvas>
<header>
  <h1>$TITLE</h1>
  <span id="stats">loading&hellip;</span>
  <span style="flex: 1"></span>
  <button id="markers" style="display:none">markers</button>
  <button id="wireframe">wireframe</button>
  <button id="autorotate">rotate</button>
  <button id="clear">clear</button>
</header>
<nav id="panel">
  <h2>parts</h2>
  <ul id="parts"></ul>
</nav>
<script type="application/json" id="wog-config">$CONFIG_JSON</script>
<script type="module">
$VIEWER_JS
</script>
</body>
</html>
