<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$TITLE - WOG Dump viewer</title>
<style>
:root {
  color-scheme: light dark;
  --font-mono: "Source Code Pro", ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --background: #1a1e24;
  --foreground: #d8dee9;
  --card: #21262e;
  --surface-2: #282e37;
  --muted-foreground: #8e99a8;
  --primary: #88c0d0;
  --primary-foreground: #1a1e24;
  --border: #3b4252;
  --border-hover: #4c566a;
}
@media (prefers-color-scheme: light) {
  :root {
    --background: #eceff4;
    --foreground: #2e3440;
    --card: #e5e9f0;
    --surface-2: #d8dee9;
    --muted-foreground: #4c566a;
    --primary: #4c6d94;
    --primary-foreground: #eceff4;
    --border: #c9cfda;
    --border-hover: #aeb6c5;
  }
}
$FONT_FACE
* { margin: 0; box-sizing: border-box; }
body {
  font-family: var(--font-mono);
  background: var(--background);
  color: var(--foreground);
  overflow: hidden;
}
#viewport { position: fixed; inset: 0; }
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 2;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
}
header h1 { font-size: 15px; font-weight: 600; }
header #stats { font-size: 12px; color: var(--muted-foreground); }
header button, #panel button, #statebar button, #animbar button {
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 5px 10px; cursor: pointer;
  border: 1px solid var(--border);
  border-radius: 0; background: transparent; color: var(--foreground);
  transition: border-color 0.15s ease;
}
header button:hover, #panel button:hover, #statebar button:hover, #animbar button:hover {
  border-color: var(--border-hover);
}
select, input[type="search"] {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 4px 6px;
  background: var(--surface-2);
  color: var(--foreground);
  border: 1px solid var(--border);
  border-radius: 0;
}
input[type="range"] { accent-color: var(--primary); }
#panel {
  position: fixed; top: 53px; right: 0; bottom: 0; width: 230px; z-index: 2;
  overflow-y: auto; padding: 8px;
  background: var(--card);
  border-left: 1px solid var(--border);
}
#card {
  position: fixed; left: 12px; bottom: 64px; z-index: 2; display: none;
  padding: 10px 14px; font-size: 13px;
  background: var(--card);
  border: 1px solid var(--border);
}
#panel h2 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted-foreground); padding: 6px 8px; font-weight: 400;
}
#search { width: 100%; margin-bottom: 6px; }
#vis-buttons { display: flex; gap: 4px; padding: 0 8px 6px; }
#vis-buttons button { flex: 1; padding: 4px 2px; font-size: 10px; }
#parts { list-style: none; padding: 0; }
#parts li {
  font-size: 13px; padding: 5px 10px; cursor: pointer;
  white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
#parts li:hover { background: var(--surface-2); }
#parts li.selected { background: var(--primary); color: var(--primary-foreground); }
#parts li.hidden-part { opacity: 0.45; text-decoration: line-through; }
#statebar {
  position: fixed; left: 0; right: 230px; bottom: 0; z-index: 2;
  display: none; align-items: center; gap: 10px;
  padding: 8px 14px;
  background: var(--card);
  border-top: 1px solid var(--border);
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted-foreground);
}
#statebar label { display: flex; align-items: center; gap: 6px; }
#explode { width: 160px; }
#animbar {
  position: fixed; left: 0; right: 230px; bottom: 42px; z-index: 2;
  display: none; align-items: center; gap: 10px;
  padding: 8px 14px;
  background: var(--card);
  border-top: 1px solid var(--border);
}
#animbar.no-states { bottom: 0; }
#timeline { flex: 1; }
#animbar #time-label { font-size: 11px; color: var(--muted-foreground); min-width: 80px; }
</style>
<script type="importmap">
$IMPORT_MAP
</script>
</head>
<body>
<canvas id="viewport"></canvas>
<header>
  <h1>$TITLE</h1>
  <span id="stats" data-i18n="loading">loading&hellip;</span>
  <span style="flex: 1"></span>
  <button id="markers" style="display:none" data-i18n="markers">markers</button>
  <button id="wireframe" data-i18n="wireframe">wireframe</button>
  <button id="autorotate" data-i18n="rotate">rotate</button>
  <button id="screenshot" data-i18n="screenshot">screenshot</button>
  <button id="clear" data-i18n="clear">clear</button>
  <button id="lang">RU</button>
</header>
<nav id="panel">
  <input type="search" id="search" data-i18n-placeholder="search" placeholder="search parts">
  <div id="vis-buttons">
    <button id="hide" data-i18n="hide">hide</button>
    <button id="isolate" data-i18n="isolate">isolate</button>
    <button id="show-all" data-i18n="showAll">show all</button>
  </div>
  <h2 data-i18n="parts">parts</h2>
  <ul id="parts"></ul>
</nav>
<div id="animbar">
  <select id="clip-select"></select>
  <button id="play" data-i18n="play">play</button>
  <input type="range" id="timeline" min="0" max="1" step="0.01" value="0">
  <span id="time-label">0.00s</span>
  <select id="speed">
    <option value="0.25">0.25x</option>
    <option value="0.5">0.5x</option>
    <option value="1" selected>1x</option>
    <option value="2">2x</option>
  </select>
</div>
<div id="statebar">
  <label><span data-i18n="state">state</span>
    <select id="state-select"></select>
  </label>
  <label><span data-i18n="explode">explode</span>
    <input type="range" id="explode" min="0" max="100" step="1" value="0">
  </label>
</div>
<script type="application/json" id="wog-config">$CONFIG_JSON</script>
<script type="module">
$VIEWER_JS
</script>
</body>
</html>
